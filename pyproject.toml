[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gkco-dvtt"
version = "1.0.0"
description = "Official implementation of GKCO-DVTT for few-shot fault diagnosis."
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "PyYAML>=6.0",
  "torch==2.8.0",
  "torch-geometric==2.6.1",
]

[tool.setuptools.packages.find]
where = ["src"]
