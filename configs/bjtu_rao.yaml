seed: 42
device: cuda
verbose: true
output_dir: outputs/bjtu_rao

dataset:
  name: bjtu_rao
  root: data/bjtu_rao
  num_classes: 5
  sample_length: 512

graph:
  k_original: 7
  k_positive: 1
  k_negative: 1
  k_optimized: 7

gcva:
  encoder_hidden: 128
  latent_dim: 64
  decoder_hidden: 128
  learning_rate: 0.0075
  epochs: 500
  contrastive_margin: 1.0
  dropout: 0.01

dvtt:
  hidden_dim: 128
  mlp_dim: 32
  num_dveb: 3
  nhead: 4
  learning_rate: 0.001
  epochs: 500
  dropout: 0.01

preprocessing:
  noise:
    enabled: false
    snr_db: 10
    seed: 42
