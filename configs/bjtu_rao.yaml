experiment:
  name: bjtu_rao
  seed: 42

dataset:
  root: data/bjtu_rao
  num_classes: 5

graph:
  k_original: 7
  k_positive: 1
  k_negative: 1
  k_optimized: 7

gcva:
  hidden_dim: 128
  latent_dim: 64
  decoder_hidden: 128
  dropout: 0.01
  lambda_reg: 0.001
  beta: 1.0
  learning_rate: 0.0075
  epochs: 500

dvtt:
  hidden_dim: 128
  mlp_hidden_dim: 32
  num_self_att_layers: 1
  num_gnn_layers: 3
  nhead: 4
  dropout: 0.01
  learning_rate: 0.001
  epochs: 500
